services:
  manager:
    build: 
      context: .
      dockerfile: ./manager/Dockerfile
    init: true
    ports:
      - ${MANAGER_PORT}:80
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - ALPHABET=${ALPHABET}

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    init: true
    deploy:
      replicas: ${NUM_WORKERS}
    environment:
      - RUST_LOG=${LOG_LEVEL}
      - ALPHABET=${ALPHABET}

  mongo1:
    image: mongo:7
    command: >
      mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo2:
    image: mongo:7
    command: >
      mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo3:
    image: mongo:7
    command: >
      mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo-init:
    image: mongo:7
    volumes:
      - ./mongo-init.js:/mongo-init.js
    command: >
      mongosh --host mongo1:27017 /mongo-init.js
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: no

  rabbitmq:
    image: rabbitmq:4
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: >
        rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  rabbitmq_data:
